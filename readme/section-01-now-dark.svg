  <text x="170" y="136" class="display" font-size="34" fill="#F0EFEA">Now<tspan fill="#F5A623">.</tspan></text>
<line x1="40" y1="172" x2="1160" y2="172" stroke="#F0EFEA" stroke-width="1" opacity="0.2"/><text x="42" y="222" class="display" font-size="20" fill="#F5A623">&#8594;</text><text x="80" y="222" class="body" font-size="19" fill="#F0EFEA">Founder &amp; lead engineer at Ryvo &#8212; building it from the backend up.</text><text x="42" y="278" class="display" font-size="20" fill="#F5A623">&#8594;</text><text x="80" y="278" class="body" font-size="19" fill="#F0EFEA">Writing services in Java / Spring Boot and Kotlin, shipping mobile in Flutter.</text><text x="42" y="334" class="display" font-size="20" fill="#F5A623">&#8594;</text><text x="80" y="334" class="body" font-size="19" fill="#F0EFEA">Opinionated about schema design &#8212; PostgreSQL first, MongoDB when the shape earns it.</text><text x="42" y="390" class="display" font-size="20" fill="#F5A623">&#8594;</text><text x="80" y="390" class="body" font-size="19" fill="#F0EFEA">Open to talking architecture, delegation, or why your data model is fighting you.</text>
</svg>
